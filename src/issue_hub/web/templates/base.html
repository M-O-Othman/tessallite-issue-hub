<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tessallite Issue Hub{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for professional icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #006C35;
            --accent-gold: #D4AF37;
            --charcoal: #333333;
            --mint: #F2F7F4;
            --white: #FFFFFF;
            --slate-border: #CBD5E1;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--mint);
            color: var(--charcoal);
            line-height: 1.6;
        }
        .navbar {
            background-color: var(--primary-green) !important;
            border-bottom: 2px solid var(--accent-gold);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--white) !important;
        }
        .navbar-brand i {
            color: var(--accent-gold);
        }
        .nav-link {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85) !important;
            transition: color 0.15s ease;
        }
        .nav-link:hover, .nav-link:focus {
            color: var(--accent-gold) !important;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--slate-border);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            padding: 1.25rem;
        }
        .btn-dark {
            background-color: var(--primary-green) !important;
            border-color: var(--primary-green) !important;
            color: var(--white) !important;
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s ease;
        }
        .btn-dark:hover {
            background-color: #005228 !important;
            border-color: #005228 !important;
            transform: translateY(-1px);
        }
        .btn-outline-dark {
            border-color: var(--primary-green) !important;
            color: var(--primary-green) !important;
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s ease;
        }
        .btn-outline-dark:hover {
            background-color: var(--primary-green) !important;
            color: var(--white) !important;
            transform: translateY(-1px);
        }
        .btn {
            border-radius: 10px;
            font-weight: 600;
        }
        .form-control, .form-select {
            border: 1px solid #8A94A6;
            border-radius: 10px;
            padding: 10px 14px;
            transition: border-color 0.15s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(0, 108, 53, 0.15);
        }
        .badge {
            font-weight: 600;
            border-radius: 6px;
        }
        .badge-terminal {
            background-color: #e9ecef;
            color: #495057;
            text-decoration: line-through;
        }
        pre {
            background-color: #f1f3f5;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--slate-border);
        }
        .btn-logout {
            border: 1.5px solid var(--accent-gold) !important;
            color: var(--accent-gold) !important;
            border-radius: 8px;
            font-weight: 600;
            padding: 6px 14px;
            background-color: transparent;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background-color: var(--accent-gold) !important;
            color: var(--charcoal) !important;
            transform: translateY(-1px);
        }
        .pagination .page-link {
            color: var(--primary-green) !important;
            border-color: var(--slate-border) !important;
            font-weight: 500;
        }
        .pagination .page-item.disabled .page-link {
            color: #8A94A6 !important;
            background-color: #f1f3f5 !important;
        }
        .pagination .page-item:not(.disabled) .page-link:hover {
            background-color: var(--primary-green) !important;
            color: var(--white) !important;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% if request.session.get("logged_in") %}
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-uppercase" href="/"><i class="fa-solid fa-bug-slash me-2"></i>Tessallite Issue Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-list me-1"></i> Issues</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/visualization"><i class="fa-solid fa-chart-line me-1"></i> Analytics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/issues/create"><i class="fa-solid fa-plus me-1"></i> Create Issue</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings"><i class="fa-solid fa-gears me-1"></i> Configuration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/help"><i class="fa-solid fa-circle-question me-1"></i> Help Center</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-light">
                    <span class="me-3 small"><i class="fa-solid fa-user me-1 text-secondary"></i> {{ request.session.get("username") }}</span>
                    <a href="/logout" class="btn-logout"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
