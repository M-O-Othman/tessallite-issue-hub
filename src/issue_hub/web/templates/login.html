{% extends "base.html" %}

{% block title %}Login - Tessallite Issue Hub{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center style-row" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm">
            <div class="text-center mb-4">
                <h3 class="text-uppercase fw-bold text-dark"><i class="fa-solid fa-bug-slash text-danger me-2"></i>Issue Hub</h3>
                <p class="text-muted small">Authoritative Sequential Issue Ledger</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="post">
                <input type="hidden" name="csrf_token" value="{{ get_csrf_token(request) }}">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold text-uppercase"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
