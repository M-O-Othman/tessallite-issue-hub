services:
  app:
    build: .
    container_name: issue-hub-app
    ports:
      - "8080:8080"
      - "5432:5432"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:placeholder_password@localhost:5432/issue_hub}
      - ISSUE_HUB_API_TOKEN=api_bearer_token_123
      - ISSUE_HUB_WEB_USERNAME=admin
      - ISSUE_HUB_WEB_PASSWORD_HASH=$$2b$$12$$aFi5o69Jva.w9qOPi952mOsdCA3kSt7QprLhhicsNJTBrQSdEaa8O # bcrypt hash of 'admin'
      - ISSUE_HUB_SESSION_SECRET=super_secret_session_key_9999
      - ISSUE_HUB_DEFAULT_PROJECT=tessallite
      - ISSUE_HUB_DEFAULT_REPOSITORY=tessallite-workspace
      - ISSUE_HUB_DEFAULT_BRANCH=main
      - ISSUE_HUB_IMPORT_ENABLED=true
      - PORT=8080
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/app

volumes:
  pgdata:
